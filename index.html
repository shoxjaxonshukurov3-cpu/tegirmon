<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qalamtarosh</title>
<meta name="description" content="Qalamtarosh: xizmat ko'rsatuvchi veb-sahifalar uchun kirish sahifasi.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">

<style>
  :root {
    --paper: #FCFAF6;
    --ink: #1B2A49;
    --muted: #8A8F98;
    --line: #E1DED6;
    --pencil: #F5C518;
    --accent: #B3261E;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17181B;
      --ink: #F1F1EC;
      --muted: #858A93;
      --line: #34373D;
      --accent: #FF8A80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #17181B;
    --ink: #F1F1EC;
    --muted: #858A93;
    --line: #34373D;
    --accent: #FF8A80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.55;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 1.25rem; }

  /* Orqa fon qatlami: logo, qalamtarosh, sarlavha, izoh */
  header { padding: 1.25rem 0 0; }
  .logo { display: block; width: 190px; max-width: 55%; height: auto; border-radius: 12px; }

  .sharpener { display: block; width: 150px; height: auto; margin: 1.5rem 0 0; opacity: .8; }

  h1 {
    font-size: clamp(1.25rem, 3.2vw, 1.625rem);
    line-height: 1.25;
    letter-spacing: -0.01em;
    font-weight: 600;
    color: var(--muted);
    margin: 1.25rem 0 0.375rem;
    max-width: 30ch;
  }
  .lead { color: var(--muted); margin: 0 0 2.75rem; font-size: 0.9375rem; }

  /* Old qatlam: xizmatlar */
  ul { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--line); }
  li { border-top: 1px solid var(--line); }
  .site {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.25rem 1rem;
    align-items: baseline;
    padding: 1.5rem 0;
    color: inherit;
    text-decoration: none;
  }
  .site .name { font-size: clamp(1.75rem, 5vw, 2.5rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .site .desc { color: var(--ink); opacity: .72; font-size: 1.0625rem; grid-column: 1; }
  .site .go { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-weight: 600; border-bottom: 2px solid var(--pencil); padding-bottom: 1px; }
  a.site:hover .name { text-decoration: underline; text-decoration-color: var(--pencil); text-decoration-thickness: 4px; text-underline-offset: 5px; }
  a.site:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .soon { opacity: 0.5; }
  .soon .name { font-size: clamp(1.25rem, 3.5vw, 1.625rem); }
  .soon .go { border-bottom-color: var(--line); font-weight: 400; }

  footer { padding: 3rem 0 2rem; color: var(--muted); font-size: 0.875rem; }
</style>
</head>
